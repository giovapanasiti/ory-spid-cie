# Ory Hydra v26.2.0 — local development configuration.
# DSN comes from the environment; secrets come from the overlay file generated by
# scripts/setup.sh (infrastructure/docker/dev-secrets/hydra.secrets.yml).
serve:
  cookies:
    same_site_mode: Lax
  public:
    cors:
      enabled: false
  admin:
    cors:
      enabled: false

urls:
  self:
    issuer: http://localhost:4444/
    public: http://localhost:4444/
  login: http://localhost:4455/login
  consent: http://localhost:4455/consent
  logout: http://localhost:4455/logout
  error: http://localhost:4455/oauth2/error
  post_logout_redirect: http://localhost:4455/logged-out

strategies:
  access_token: jwt
  scope: exact

oidc:
  subject_identifiers:
    supported_types:
      - public

oauth2:
  pkce:
    enforced_for_public_clients: true
  expose_internal_errors: false
  session:
    encrypt_at_rest: true

ttl:
  access_token: 15m
  refresh_token: 720h
  id_token: 1h
  auth_code: 5m
  login_consent_request: 30m

webfinger:
  oidc_discovery:
    supported_scope:
      - openid
      - offline_access
      - profile
      - email
      - fiscal_number
      - profile.read
      - reports.read
    supported_claims:
      - sub
      - loa
      - idp
      - federated_acr
      - identity_verified
      - given_name
      - family_name
      - name
      - email
      - email_verified
      - birthdate
      - fiscal_number

log:
  level: info
  format: json
  leak_sensitive_values: false
