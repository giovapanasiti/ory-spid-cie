# Ory Kratos v26.2.0 — local development configuration.
# DSN comes from the environment; secrets, SMTP and the SPID/CIE OIDC providers come from
# the overlay file generated by scripts/setup.sh (infrastructure/docker/dev-secrets/kratos.secrets.yml).
serve:
  public:
    base_url: http://localhost:4433/
    cors:
      # Required so the login UI can load webauthn.js (crossorigin + SRI) for passkeys.
      enabled: true
      allowed_origins:
        - http://localhost:4455
      allowed_methods: [GET, POST]
      allow_credentials: true
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: http://localhost:3200/
  allowed_return_urls:
    - http://localhost:4455
    - http://localhost:3100
    - http://localhost:3200
    - http://localhost:5580
    - http://localhost:4444

  methods:
    password:
      enabled: true
      config:
        min_password_length: 12
        identifier_similarity_check_enabled: true
        haveibeenpwned_enabled: false  # enable in environments with outbound access
    passkey:
      enabled: true
      config:
        rp:
          display_name: IAM Platform
          id: localhost
          origins:
            - http://localhost:4455
    code:
      enabled: true
    profile:
      enabled: true
    oidc:
      enabled: true

  flows:
    error:
      ui_url: http://localhost:4455/auth/error
    settings:
      ui_url: http://localhost:4455/auth/settings
      privileged_session_max_age: 10m
      required_aal: highest_available
    recovery:
      enabled: true
      ui_url: http://localhost:4455/auth/recovery
      use: code
    verification:
      enabled: true
      ui_url: http://localhost:4455/auth/verification
      use: code
      after:
        default_browser_return_url: http://localhost:3200/
    logout:
      after:
        default_browser_return_url: http://localhost:4455/auth/login
    login:
      ui_url: http://localhost:4455/auth/login
      lifespan: 10m
    registration:
      ui_url: http://localhost:4455/auth/registration
      lifespan: 10m
      after:
        password:
          hooks:
            - hook: session
            - hook: show_verification_ui
        passkey:
          hooks:
            - hook: session
        oidc:
          hooks:
            - hook: session

session:
  lifespan: 24h
  earliest_possible_extend: 1h
  cookie:
    same_site: Lax

cookies:
  same_site: Lax

log:
  level: info
  format: json
  leak_sensitive_values: false

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 12

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    from_address: no-reply@iam.local
    from_name: IAM Platform
